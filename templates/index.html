<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Paper Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <h1>AI Research Generator</h1>
                </div>
                <p class="subtitle">Generate comprehensive research papers with AI assistance</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Form -->
            <div class="form-container">
                <div class="form-card">
                    <h2><i class="fas fa-edit"></i> Research Paper Details</h2>
                    
                    <form id="researchForm" class="research-form">
                        <div class="form-group">
                            <label for="topic">
                                <i class="fas fa-lightbulb"></i>
                                Research Topic
                            </label>
                            <input type="text" id="topic" name="topic" placeholder="e.g., Artificial Intelligence in Education" required>
                        </div>

                        <div class="form-group">
                            <label for="language">
                                <i class="fas fa-language"></i>
                                Language
                            </label>
                            <select id="language" name="language" required>
                                <option value="English">English</option>
                                <option value="Arabic">Arabic</option>
                                <option value="Spanish">Spanish</option>
                                <option value="French">French</option>
                                <option value="German">German</option>
                                <option value="Chinese">Chinese</option>
                                <option value="Japanese">Japanese</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="pages">
                                <i class="fas fa-file-alt"></i>
                                Number of Pages
                            </label>
                            <select id="pages" name="pages" required>
                                <option value="2">2 Pages</option>
                                <option value="3" selected>3 Pages</option>
                                <option value="5">5 Pages</option>
                                <option value="7">7 Pages</option>
                                <option value="10">10 Pages</option>
                            </select>
                        </div>

                        <button type="submit" class="generate-btn" id="generateBtn">
                            <i class="fas fa-magic"></i>
                            <span>Generate Research Paper</span>
                            <div class="loading-spinner" id="loadingSpinner">
                                <i class="fas fa-spinner fa-spin"></i>
                            </div>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-container" id="resultsContainer" style="display: none;">
                <div class="results-card">
                    <div class="results-header">
                        <h2><i class="fas fa-file-alt"></i> Generated Research Paper</h2>
                        <div class="results-actions">
                            <button class="action-btn download-btn" id="downloadBtn">
                                <i class="fas fa-download"></i>
                                Download PDF
                            </button>
                            <button class="action-btn copy-btn" id="copyBtn">
                                <i class="fas fa-copy"></i>
                                Copy Text
                            </button>
                        </div>
                    </div>
                    
                    <div class="paper-info" id="paperInfo">
                        <div class="info-item">
                            <i class="fas fa-tag"></i>
                            <span>Topic: <strong id="paperTopic"></strong></span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-language"></i>
                            <span>Language: <strong id="paperLanguage"></strong></span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-file-alt"></i>
                            <span>Pages: <strong id="paperPages"></strong></span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-clock"></i>
                            <span>Generated: <strong id="paperDate"></strong></span>
                        </div>
                    </div>

                    <div class="paper-content" id="paperContent">
                        <!-- Research paper content will be inserted here -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 AI Research Generator. Powered by Google Gemini AI.</p>
        </footer>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
